name: Frontmatter

on:
  push:
  pull_request:

jobs:
  frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.3
      - name: Testes da checagem
        run: python -m unittest discover -s tests -v
      - name: Frontmatter YAML de todos os assuntos
        run: python scripts/frontmatter.py
